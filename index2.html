<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROCURE — Desktop Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
        rel="stylesheet">
    <style>
        /* ---------- Reset ---------- */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        body {
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
        }

        button {
            font: inherit;
            color: inherit;
            background: none;
            border: none;
            cursor: pointer;
        }

        input,
        textarea {
            font: inherit;
            color: inherit;
            background: none;
            border: none;
            outline: none;
        }

        ul,
        ol {
            list-style: none;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* ---------- Tokens ---------- */
        :root {
            --bg: #ffffff;
            --fg: #000000;
            --muted: #6e6e6e;
            --line: #e6e6e6;
            --line-strong: #000000;
            --soft: #f4f4f4;
            --ease: cubic-bezier(.2, .8, .2, 1);
        }

        body {
            background: var(--soft);
            color: var(--fg);
            font-family: 'Space Grotesk', system-ui, sans-serif;
            font-size: 15px;
            line-height: 1.4;
            min-height: 100vh;
            display: flex;
        }

        /* ---------- Sidebar ---------- */
        .sidebar {
            width: 240px;
            background: var(--bg);
            border-right: 2px solid var(--line-strong);
            display: flex;
            flex-direction: column;
            padding: 28px 0;
            flex-shrink: 0;
            position: sticky;
            top: 0;
            height: 100vh;
        }

        .brand-side {
            font-family: 'Archivo Black', sans-serif;
            font-size: 22px;
            letter-spacing: 0.14em;
            padding: 0 28px 28px;
            border-bottom: 1px solid var(--line);
        }

        .brand-side .dot {
            display: inline-block;
            width: 9px;
            height: 9px;
            background: var(--fg);
            border-radius: 50%;
            margin-left: 2px;
            transform: translateY(-4px);
            animation: pulseDot 2.4s var(--ease) infinite;
        }

        @keyframes pulseDot {

            0%,
            100% {
                opacity: 1
            }

            50% {
                opacity: .25
            }
        }

        .nav-side {
            padding: 24px 0;
            flex: 1;
        }

        .nav-side li {
            margin-bottom: 4px;
        }

        .nav-side button {
            width: 100%;
            text-align: left;
            padding: 14px 28px;
            display: flex;
            align-items: center;
            gap: 14px;
            font-family: 'Archivo Black', sans-serif;
            font-size: 14px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            border-left: 4px solid transparent;
            transition: background .15s var(--ease), border-color .15s var(--ease);
        }

        .nav-side button svg {
            width: 18px;
            height: 18px;
            stroke-width: 2;
        }

        .nav-side button.active {
            background: var(--soft);
            border-left-color: var(--line-strong);
        }

        .nav-side button:hover:not(.active) {
            background: var(--soft);
        }

        .sidebar-foot {
            padding: 20px 28px;
            border-top: 1px solid var(--line);
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.15em;
            color: var(--muted);
            text-transform: uppercase;
        }

        /* ---------- Main Wrapper ---------- */
        .main-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            height: 100vh;
        }

        /* ---------- Top Header ---------- */
        .top-header {
            height: 80px;
            background: var(--bg);
            border-bottom: 2px solid var(--line-strong);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            flex-shrink: 0;
        }

        .top-header h1 {
            font-family: 'Archivo Black', sans-serif;
            font-size: 28px;
            letter-spacing: -0.01em;
            text-transform: uppercase;
        }

        .top-header .meta {
            display: flex;
            align-items: center;
            gap: 32px;
        }

        .top-header .stat {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .top-header .stat span {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.15em;
            color: var(--muted);
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        .top-header .stat strong {
            font-family: 'Archivo Black', sans-serif;
            font-size: 20px;
        }

        /* ---------- Dashboard Content ---------- */
        .dashboard {
            flex: 1;
            display: grid;
            grid-template-columns: 380px 1fr;
            overflow: hidden;
        }

        /* ---------- Left Column (Input) ---------- */
        .input-col {
            border-right: 2px solid var(--line-strong);
            overflow-y: auto;
            background: var(--bg);
            display: flex;
            flex-direction: column;
        }

        .input-col::-webkit-scrollbar {
            width: 4px;
        }

        .input-col::-webkit-scrollbar-thumb {
            background: var(--line);
        }

        /* ---------- Upload Section ---------- */
        .upload-zone {
            padding: 40px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            border-bottom: 1px solid var(--line);
            position: relative;
        }

        .upload-zone::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 50%, rgba(0, 0, 0, 0.03) 0%, transparent 60%);
            pointer-events: none;
        }

        .section-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            letter-spacing: 0.22em;
            color: var(--muted);
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .section-label::before,
        .section-label::after {
            content: '';
            width: 24px;
            height: 1px;
            background: var(--line-strong);
        }

        .upload-btn {
            width: 100%;
            height: 220px;
            border: 2px dashed var(--line-strong);
            background: var(--bg);
            color: var(--fg);
            position: relative;
            display: grid;
            place-items: center;
            transition: background .15s var(--ease), color .15s var(--ease);
            z-index: 1;
        }

        .upload-btn:hover {
            background: var(--fg);
            color: var(--bg);
        }

        .upload-btn.dragover {
            background: var(--fg);
            color: var(--bg);
        }

        .upload-btn .ub-inner {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .upload-btn .ub-icon {
            width: 48px;
            height: 48px;
            border: 2px solid currentColor;
            border-radius: 50%;
            display: grid;
            place-items: center;
            margin-bottom: 6px;
        }

        .upload-btn .ub-label {
            font-family: 'Archivo Black', sans-serif;
            font-size: 18px;
            letter-spacing: 0.08em;
        }

        .upload-btn .ub-sub {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            letter-spacing: 0.2em;
            opacity: 0.7;
        }

        /* ---------- Mode toggles ---------- */
        .mode-row {
            padding: 20px 30px;
            border-bottom: 1px solid var(--line);
        }

        .modes {
            display: grid;
            grid-template-columns: 1fr 1fr;
            border: 2px solid var(--line-strong);
        }

        .mode {
            padding: 14px 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-family: 'Archivo Black', sans-serif;
            font-size: 12px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            border-right: 2px solid var(--line-strong);
            transition: background .15s var(--ease), color .15s var(--ease);
        }

        .mode:last-child {
            border-right: none;
        }

        .mode.active {
            background: var(--fg);
            color: var(--bg);
        }

        .mode:not(.active):hover {
            background: var(--soft);
        }

        .mode svg {
            width: 16px;
            height: 16px;
        }

        .mode .pulse {
            width: 8px;
            height: 8px;
            background: currentColor;
            border-radius: 50%;
            margin-left: 4px;
            opacity: 0;
        }

        .mode.recording .pulse {
            opacity: 1;
            animation: recPulse 0.9s var(--ease) infinite;
        }

        @keyframes recPulse {

            0%,
            100% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.6);
                opacity: 0.3;
            }
        }

        /* ---------- Voice panel ---------- */
        .voice-panel {
            max-height: 0;
            overflow: hidden;
            transition: max-height .35s var(--ease);
        }

        .voice-panel.open {
            max-height: 220px;
        }

        .voice-inner {
            padding: 24px 30px;
            border-bottom: 1px solid var(--line);
        }

        .wave-wrap {
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            border: 1px solid var(--line);
            padding: 0 14px;
            margin-bottom: 14px;
        }

        .wave-bar {
            width: 3px;
            background: var(--fg);
            height: 6px;
            transition: height .1s var(--ease);
        }

        .voice-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .voice-time {
            font-family: 'JetBrains Mono', monospace;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.04em;
        }

        .voice-state {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .voice-state.rec {
            color: var(--fg);
        }

        .voice-state.rec::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--fg);
            border-radius: 50%;
            margin-right: 6px;
            vertical-align: middle;
            animation: recPulse 0.9s var(--ease) infinite;
        }

        /* ---------- Manual form ---------- */
        .manual {
            padding: 24px 30px;
            border-bottom: 1px solid var(--line);
            flex: 1;
        }

        .field {
            border-bottom: 2px solid var(--line-strong);
            padding: 12px 0 8px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .field+.field {
            border-top: 1px solid var(--line);
        }

        .field .f-num {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            font-weight: 700;
            color: var(--muted);
            letter-spacing: 0.1em;
            width: 24px;
            flex-shrink: 0;
        }

        .field .f-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.18em;
            color: var(--muted);
            text-transform: uppercase;
            width: 70px;
            flex-shrink: 0;
        }

        .field input,
        .field textarea {
            flex: 1;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 15px;
            font-weight: 500;
            padding: 4px 0;
            min-width: 0;
        }

        .field textarea {
            resize: none;
            min-height: 22px;
            line-height: 1.3;
        }

        .field input::placeholder,
        .field textarea::placeholder {
            color: #b0b0b0;
            font-weight: 400;
        }

        .field-amt input {
            font-family: 'Archivo Black', sans-serif;
            font-size: 20px;
            letter-spacing: -0.01em;
        }

        .field-amt .currency {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--muted);
            margin-right: 4px;
        }

        /* ---------- Category chips ---------- */
        .chips {
            padding: 20px 30px;
            border-bottom: 1px solid var(--line);
        }

        .chips-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.2em;
            color: var(--muted);
            text-transform: uppercase;
            margin-bottom: 12px;
            display: block;
        }

        .chip-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .chip {
            padding: 8px 14px;
            border: 1.5px solid var(--line-strong);
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            transition: background .15s var(--ease), color .15s var(--ease);
        }

        .chip.active {
            background: var(--fg);
            color: var(--bg);
        }

        .chip:hover:not(.active) {
            background: var(--soft);
        }

        .chip:active {
            transform: translateY(1px);
        }

        /* ---------- Right Column (Activity) ---------- */
        .activity-col {
            overflow-y: auto;
            background: var(--bg);
            padding: 0;
        }

        .activity-col::-webkit-scrollbar {
            width: 4px;
        }

        .activity-col::-webkit-scrollbar-thumb {
            background: var(--line);
        }

        .act-header {
            padding: 32px 40px 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-bottom: 2px solid var(--line-strong);
            position: sticky;
            top: 0;
            background: var(--bg);
            z-index: 10;
        }

        .act-header h2 {
            font-family: 'Archivo Black', sans-serif;
            font-size: 36px;
            letter-spacing: -0.02em;
            text-transform: uppercase;
        }

        .act-header .count {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            font-weight: 700;
            color: var(--muted);
            letter-spacing: 0.1em;
        }

        .activity-list {
            padding: 0 40px 40px;
        }

        .act-item {
            display: grid;
            grid-template-columns: 56px 1fr auto auto;
            gap: 24px;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid var(--line);
            transition: background .15s var(--ease);
            animation: slideUp .35s var(--ease) backwards;
        }

        .act-item:hover {
            background: var(--soft);
            margin: 0 -20px;
            padding: 20px;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .act-type {
            width: 56px;
            height: 56px;
            border: 2px solid var(--line-strong);
            display: grid;
            place-items: center;
        }

        .act-type svg {
            width: 22px;
            height: 22px;
        }

        .act-body {
            min-width: 0;
        }

        .act-vendor {
            font-family: 'Archivo Black', sans-serif;
            font-size: 16px;
            letter-spacing: 0.02em;
            text-transform: uppercase;
            line-height: 1.2;
            margin-bottom: 4px;
        }

        .act-desc {
            font-size: 13px;
            color: var(--muted);
            line-height: 1.3;
            margin-bottom: 8px;
        }

        .act-meta {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            color: var(--muted);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .act-meta .sep::before {
            content: '·';
            margin-right: 10px;
        }

        .act-cat {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            padding: 6px 10px;
            border: 1px solid var(--line-strong);
        }

        .act-amt {
            font-family: 'Archivo Black', sans-serif;
            font-size: 20px;
            letter-spacing: -0.01em;
            text-align: right;
            min-width: 120px;
        }

        /* ---------- Toast ---------- */
        .toast {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--fg);
            color: var(--bg);
            padding: 14px 24px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity .25s var(--ease), transform .25s var(--ease);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast .t-dot {
            width: 8px;
            height: 8px;
            background: var(--bg);
            border-radius: 50%;
            animation: pulseDot 1.2s var(--ease) infinite;
        }

        /* ---------- Image Preview Modal ---------- */
        .preview {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            color: var(--bg);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            opacity: 0;
            pointer-events: none;
            transition: opacity .25s var(--ease);
            padding: 40px;
        }

        .preview.open {
            opacity: 1;
            pointer-events: all;
        }

        .preview-inner {
            background: var(--fg);
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 500px;
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        .preview-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
        }

        .preview-head .ph-title {
            font-family: 'Archivo Black', sans-serif;
            font-size: 14px;
            letter-spacing: 0.14em;
        }

        .preview-head .ph-close {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            letter-spacing: 0.1em;
            padding: 6px 10px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            transition: background .15s var(--ease);
        }

        .preview-head .ph-close:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .preview-canvas {
            padding: 24px;
            max-height: 60vh;
            overflow: hidden;
            display: grid;
            place-items: center;
        }

        #preview-img {
            max-width: 100%;
            max-height: 50vh;
            object-fit: contain;
            filter: grayscale(1) contrast(1.1);
        }

        .preview-foot {
            padding: 20px 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            gap: 12px;
        }

        .preview-foot .btn {
            flex: 1;
            padding: 16px 12px;
            font-family: 'Archivo Black', sans-serif;
            font-size: 13px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            text-align: center;
            transition: opacity .15s var(--ease);
        }

        .btn:hover {
            opacity: 0.8;
        }

        .btn-outline {
            border: 2px solid rgba(255, 255, 255, 0.5);
            color: var(--bg);
        }

        .btn-solid {
            background: var(--bg);
            color: var(--fg);
        }

        /* ---------- Empty state ---------- */
        .empty {
            padding: 80px 22px;
            text-align: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: var(--muted);
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        /* Reduce motion */
        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="brand-side">PROCURE<span class="dot"></span></div>
        <ul class="nav-side">
            <li><button class="active">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M4 4h16v16H4z" />
                        <line x1="8" y1="9" x2="16" y2="9" />
                        <line x1="8" y1="13" x2="16" y2="13" />
                        <line x1="8" y1="17" x2="13" y2="17" />

                    LOG
                </button></li>
            <li><button>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <line x1="4" y1="20" x2="4" y2="10" />
                        <line x1="10" y1="20" x2="10" y2="4" />
                        <line x1="16" y1="20" x2="16" y2="14" />
                        <line x1="22" y1="20" x2="22" y2="8" />
                    </svg>
                    REPORTS
                </button></li>
            <li><button>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <circle cx="12" cy="12" r="9" />
                        <path d="M12 3a9 9 0 0 1 0 18" />
                        <line x1="12" y1="3" x2="12" y2="21" />
                    </svg>
                    BUDGET
                </button></li>
            <li><button>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M21 12a9 9 0 0 1-9 9 9 9 0 0 1-7.9-4.7" />
                        <path d="M3 12a9 9 0 0 1 9-9 9 9 0 0 1 7.9 4.7" />
                        <polyline points="21 4 21 9 16 9" />
                        <polyline points="3 20 3 15 8 15" />
                    </svg>
                    SYNC
                </button></li>
        </ul>
        <div class="sidebar-foot">
            OFFICER · J. DOE<br>
            Q3 BUDGET
        </div>
    </aside>

    <!-- Main Wrapper -->
    <div class="main-wrapper">

        <!-- Top Header -->
        <header class="top-header">
            <h1>Dashboard</h1>
            <div class="meta">
                <div class="stat">
                    <span>Today</span>
                    <strong id="today-total">$847.20</strong>
                </div>
                <div class="stat">
                    <span>Items</span>
                    <strong id="item-count">03</strong>
                </div>
            </div>
        </header>

        <!-- Dashboard Grid -->
        <div class="dashboard">

            <!-- Input Column -->
            <section class="input-col">

                <!-- Upload Image Section -->
                <div class="upload-zone">
                    <div class="section-label">UPLOAD RECEIPT</div>
                    <input type="file" id="file-input" accept="image/*" style="display: none;">
                    <button class="upload-btn" id="upload-btn" aria-label="Upload receipt image">
                        <span class="ub-inner">
                            <span class="ub-icon">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                                    <polyline points="17 8 12 3 7 8" />
                                    <line x1="12" y1="3" x2="12" y2="15" />
                                </svg>
                            </span>
                            <span class="ub-label">UPLOAD IMAGE</span>
                            <span class="ub-sub">DRAG & DROP OR CLICK</span>
                        </span>
                    </button>
                </div>

                <!-- Mode toggles -->
                <div class="mode-row">
                    <div class="modes">
                        <button class="mode" id="mode-voice" data-mode="voice">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="9" y="3" width="6" height="11" rx="3" />
                                <path d="M5 11a7 7 0 0 0 14 0" />
                                <line x1="12" y1="18" x2="12" y2="22" />
                            </svg>
                            <span>VOICE</span>
                            <span class="pulse"></span>
                        </button>
                        <button class="mode" id="mode-manual" data-mode="manual">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M4 20h4l10-10-4-4L4 16v4z" />
                                <line x1="14" y1="6" x2="18" y2="10" />
                            </svg>
                            <span>MANUAL</span>
                        </button>
                    </div>
                </div>

                <!-- Voice panel -->
                <section class="voice-panel" id="voice-panel">
                    <div class="voice-inner">
                        <div class="wave-wrap" id="wave-wrap"></div>
                        <div class="voice-meta">
                            <span class="voice-time" id="voice-time">00:00</span>
                            <span class="voice-state" id="voice-state">TAP MIC TO RECORD</span>
                        </div>
                    </div>
                </section>

                <!-- Manual form -->
                <section class="manual">
                    <div class="field">
                        <span class="f-num">01</span>
                        <span class="f-label">Vendor</span>
                        <input type="text" id="in-vendor" placeholder="Start typing…" autocomplete="off">
                    </div>
                    <div class="field">
                        <span class="f-num">02</span>
                        <span class="f-label">Item</span>
                        <input type="text" id="in-item" placeholder="What was purchased?" autocomplete="off">
                    </div>
                    <div class="field field-amt">
                        <span class="f-num">03</span>
                        <span class="f-label">Amount</span>
                        <span class="currency">USD</span>
                        <input type="number" id="in-amount" placeholder="0.00" inputmode="decimal" step="0.01">
                    </div>
                    <div class="field">
                        <span class="f-num">04</span>
                        <span class="f-label">Note</span>
                        <textarea id="in-note" rows="1" placeholder="Optional details"></textarea>
                    </div>
                </section>

                <!-- Category chips -->
                <section class="chips">
                    <span class="chips-title">Category</span>
                    <div class="chip-row" id="chip-row">
                        <button class="chip active" data-cat="SUPPLIES">Supplies</button>
                        <button class="chip" data-cat="EQUIPMENT">Equipment</button>
                        <button class="chip" data-cat="SERVICES">Services</button>
                        <button class="chip" data-cat="TRAVEL">Travel</button>
                        <button class="chip" data-cat="MISC">Misc</button>
                    </div>
                </section>

            </section>

            <!-- Activity Column -->
            <section class="activity-col">
                <div class="act-header">
                    <h2>Activity Log</h2>
                    <span class="count" id="act-count">03 ENTRIES</span>
                </div>
                <ul class="activity-list" id="activity-list">
                    <!-- Populated by JS -->
                </ul>
                <div class="empty" id="empty-state" style="display:none;">— No further entries —</div>
            </section>

        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast">
        <span class="t-dot"></span>
        <span id="toast-text">SAVED</span>
    </div>

    <!-- Image Preview Modal -->
    <div class="preview" id="preview">
        <div class="preview-inner">
            <div class="preview-head">
                <span class="ph-title">RECEIPT — PREVIEW</span>
                <button class="ph-close" id="preview-close">CLOSE</button>
            </div>
            <div class="preview-canvas">
                <img id="preview-img" alt="Receipt preview" style="display:none;">
            </div>
            <div class="preview-foot">
                <button class="btn btn-outline" id="preview-retake">REPLACE</button>
                <button class="btn btn-solid" id="preview-use">USE LOG</button>
            </div>
        </div>
    </div>

    <script>
        // ---------- State ----------
        const state = {
            entries: [
                { id: 1, vendor: 'STAPLES', desc: 'Office supplies — toner, paper, pens', amount: 142.50, cat: 'SUPPLIES', time: '09:12', type: 'manual' },
                { id: 2, vendor: 'U-HAUL', desc: 'Storage unit rental — 30 days', amount: 220.00, cat: 'EQUIPMENT', time: '08:45', type: 'photo' },
                { id: 3, vendor: 'FEDEX', desc: 'Express shipping — confidential docs', amount: 67.20, cat: 'SERVICES', time: '08:30', type: 'voice' },
            ],
            currentCat: 'SUPPLIES',
            voiceRecording: false,
            voiceSeconds: 0,
            voiceTimer: null,
            audioCtx: null,
            analyser: null,
            micStream: null,
            waveBars: [],
        };

        // ---------- Render activity ----------
        const typeIcons = {
            photo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h4l2-2h6l2 2h4v13H3z"/><circle cx="12" cy="13.5" r="4"/></svg>',
            voice: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><line x1="12" y1="18" x2="12" y2="22"/></svg>',
            manual: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h4l10-10-4-4L4 16v4z"/><line x1="14" y1="6" x2="18" y2="10"/></svg>',
        };

        function renderActivity() {
            const list = document.getElementById('activity-list');
            list.innerHTML = '';
            if (state.entries.length === 0) {
                document.getElementById('empty-state').style.display = 'block';
            } else {
                document.getElementById('empty-state').style.display = 'none';
            }
            state.entries.slice(0, 20).forEach((e, idx) => {
                const li = document.createElement('li');
                li.className = 'act-item';
                li.style.animationDelay = `${idx * 0.04}s`;
                li.innerHTML = `
        <div class="act-type">${typeIcons[e.type] || typeIcons.manual}</div>
        <div class="act-body">
          <div class="act-vendor">${e.vendor}</div>
          <div class="act-desc">${e.desc}</div>
          <div class="act-meta">
            <span>${e.time}</span>
            <span class="sep">LOGGED</span>
          </div>
        </div>
        <div class="act-cat">${e.cat}</div>
        <div class="act-amt">$${e.amount.toFixed(2)}</div>
      `;
                list.appendChild(li);
            });
            document.getElementById('act-count').textContent = `${String(state.entries.length).padStart(2, '0')} ENTR${state.entries.length === 1 ? 'Y' : 'IES'}`;
            document.getElementById('item-count').textContent = String(state.entries.length).padStart(2, '0');
            const total = state.entries.reduce((s, e) => s + e.amount, 0);
            document.getElementById('today-total').textContent = `$${total.toFixed(2)}`;
        }
        renderActivity();

        // ---------- Toast ----------
        let toastTimer;
        function toast(msg) {
            const t = document.getElementById('toast');
            document.getElementById('toast-text').textContent = msg;
            t.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
        }

        // ---------- Category chips ----------
        document.getElementById('chip-row').addEventListener('click', (e) => {
            const chip = e.target.closest('.chip');
            if (!chip) return;
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            chip.classList.add('active');
            state.currentCat = chip.dataset.cat;
        });

        // ---------- Upload Image Button ----------
        const uploadBtn = document.getElementById('upload-btn');
        const fileInput = document.getElementById('file-input');

        uploadBtn.addEventListener('click', () => fileInput.click());

        uploadBtn.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadBtn.classList.add('dragover');
        });

        uploadBtn.addEventListener('dragleave', () => {
            uploadBtn.classList.remove('dragover');
        });

        uploadBtn.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadBtn.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                handleImageUpload(file);
            } else {
                toast('PLEASE DROP AN IMAGE FILE');
            }
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                handleImageUpload(file);
            }
        });

        function handleImageUpload(file) {
            const reader = new FileReader();
            reader.onload = (event) => {
                showPreview(event.target.result);
            };
            reader.readAsDataURL(file);
        }

        function showPreview(dataUrl) {
            const img = document.getElementById('preview-img');
            img.src = dataUrl;
            img.style.display = 'block';
            document.getElementById('preview').classList.add('open');
        }

        document.getElementById('preview-close').addEventListener('click', () => {
            document.getElementById('preview').classList.remove('open');
        });
        document.getElementById('preview-retake').addEventListener('click', () => {
            document.getElementById('preview').classList.remove('open');
            fileInput.value = ''; // Reset input to allow re-uploading same file
            setTimeout(() => fileInput.click(), 250);
        });
        document.getElementById('preview-use').addEventListener('click', () => {
            document.getElementById('preview').classList.remove('open');
            // Pre-fill manual form with simulated OCR data
            document.getElementById('in-vendor').value = 'STAPLES';
            document.getElementById('in-item').value = 'Office supplies (auto-detected)';
            document.getElementById('in-amount').value = '122.22';
            toast('RECEIPT ATTACHED — REVIEW & SAVE');
        });

        // ---------- Voice input ----------
        const modeVoice = document.getElementById('mode-voice');
        const modeManual = document.getElementById('mode-manual');
        const voicePanel = document.getElementById('voice-panel');

        modeVoice.addEventListener('click', toggleVoice);
        modeManual.addEventListener('click', () => {
            closeVoice();
            document.getElementById('in-vendor').focus();
        });

        function toggleVoice() {
            if (state.voiceRecording) {
                stopVoiceRecording();
            } else {
                startVoiceRecording();
            }
        }

        async function startVoiceRecording() {
            modeVoice.classList.add('recording', 'active');
            modeManual.classList.remove('active');
            voicePanel.classList.add('open');
            document.getElementById('voice-state').textContent = 'LISTENING…';
            document.getElementById('voice-state').classList.add('rec');
            document.getElementById('voice-time').textContent = '00:00';
            state.voiceSeconds = 0;
            buildWaveBars();

            // Try real microphone
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                state.micStream = stream;
                state.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const source = state.audioCtx.createMediaStreamSource(stream);
                state.analyser = state.audioCtx.createAnalyser();
                state.analyser.fftSize = 64;
                source.connect(state.analyser);
                animateWaveReal();
            } catch (err) {
                // Simulated waveform
                animateWaveSimulated();
            }

            state.voiceTimer = setInterval(() => {
                state.voiceSeconds++;
                const m = String(Math.floor(state.voiceSeconds / 60)).padStart(2, '0');
                const s = String(state.voiceSeconds % 60).padStart(2, '0');
                document.getElementById('voice-time').textContent = `${m}:${s}`;
                if (state.voiceSeconds >= 30) stopVoiceRecording();
            }, 1000);
        }

        function stopVoiceRecording() {
            if (state.voiceTimer) { clearInterval(state.voiceTimer); state.voiceTimer = null; }
            modeVoice.classList.remove('recording');
            document.getElementById('voice-state').textContent = 'PROCESSING…';
            document.getElementById('voice-state').classList.remove('rec');

            if (state.micStream) {
                state.micStream.getTracks().forEach(t => t.stop());
                state.micStream = null;
            }
            if (state.audioCtx) {
                state.audioCtx.close();
                state.audioCtx = null;
            }

            // Simulate speech-to-text
            setTimeout(() => {
                const sample = pickSample();
                document.getElementById('in-vendor').value = sample.vendor;
                document.getElementById('in-item').value = sample.item;
                document.getElementById('in-amount').value = sample.amount;
                document.getElementById('voice-state').textContent = `TRANSCRIBED · ${sample.vendor}`;
                toast('VOICE NOTE TRANSCRIBED');
                setTimeout(() => {
                    voicePanel.classList.remove('open');
                    document.getElementById('voice-state').textContent = 'TAP MIC TO RECORD';
                    document.getElementById('voice-time').textContent = '00:00';
                    modeVoice.classList.remove('active');
                }, 1400);
            }, 900);
        }

        function closeVoice() {
            if (state.voiceRecording) stopVoiceRecording();
            voicePanel.classList.remove('open');
            modeVoice.classList.remove('active');
        }

        function pickSample() {
            const samples = [
                { vendor: 'HOME DEPOT', item: 'Drill bits and anchors', amount: '34.97' },
                { vendor: 'AMAZON', item: 'USB-C cables, 6ft, pack of 3', amount: '18.99' },
                { vendor: 'OFFICE DEPOT', item: 'Ergonomic keyboard', amount: '79.00' },
                { vendor: 'UBER', item: 'Travel to vendor site', amount: '24.50' },
            ];
            return samples[Math.floor(Math.random() * samples.length)];
        }

        // ---------- Waveform ----------
        function buildWaveBars() {
            const wrap = document.getElementById('wave-wrap');
            wrap.innerHTML = '';
            state.waveBars = [];
            const count = 48;
            for (let i = 0; i < count; i++) {
                const b = document.createElement('div');
                b.className = 'wave-bar';
                wrap.appendChild(b);
                state.waveBars.push(b);
            }
        }

        function animateWaveReal() {
            const data = new Uint8Array(state.analyser.frequencyBinCount);
            const tick = () => {
                if (!state.analyser) return;
                state.analyser.getByteFrequencyData(data);
                const step = Math.floor(data.length / state.waveBars.length);
                state.waveBars.forEach((bar, i) => {
                    const v = data[i * step] || 0;
                    const h = Math.max(4, (v / 255) * 56);
                    bar.style.height = h + 'px';
                });
                if (state.voiceRecording !== false && state.micStream) {
                    requestAnimationFrame(tick);
                }
            };
            state.voiceRecording = true;
            tick();
        }

        let simTimer;
        function animateWaveSimulated() {
            state.voiceRecording = true;
            simTimer = setInterval(() => {
                state.waveBars.forEach((bar, i) => {
                    const t = Date.now() / 200;
                    const base = Math.sin(t + i * 0.4) * 0.5 + 0.5;
                    const noise = Math.random() * 0.4;
                    const h = Math.max(4, (base * 0.7 + noise) * 50);
                    bar.style.height = h + 'px';
                });
            }, 80);
            setTimeout(() => clearInterval(simTimer), 30000);
        }

        // ---------- Save entry ----------
        function saveEntry(type = 'manual') {
            const vendor = document.getElementById('in-vendor').value.trim();
            const item = document.getElementById('in-item').value.trim();
            const amount = parseFloat(document.getElementById('in-amount').value) || 0;
            const note = document.getElementById('in-note').value.trim();

            if (!vendor && !item) {
                toast('ENTER VENDOR OR ITEM');
                return null;
            }

            const d = new Date();
            const time = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;

            const entry = {
                id: Date.now(),
                vendor: (vendor || 'UNKNOWN').toUpperCase(),
                desc: item || note || '—',
                amount: amount || 0,
                cat: state.currentCat,
                time,
                type,
            };
            state.entries.unshift(entry);
            renderActivity();
            return entry;
        }

        // ---------- Auto-save on field completion ----------
        let saveTimer;
        function scheduleSave() {
            clearTimeout(saveTimer);
            saveTimer = setTimeout(() => {
                const vendor = document.getElementById('in-vendor').value.trim();
                const amount = document.getElementById('in-amount').value.trim();
                if (vendor && amount) {
                    saveEntry('manual');
                    // Clear fields
                    document.getElementById('in-vendor').value = '';
                    document.getElementById('in-item').value = '';
                    document.getElementById('in-amount').value = '';
                    document.getElementById('in-note').value = '';
                    toast('ENTRY LOGGED');
                }
            }, 1200);
        }
        ['in-vendor', 'in-item', 'in-amount', 'in-note'].forEach(id => {
            document.getElementById(id).addEventListener('input', scheduleSave);
        });

        // ---------- Textarea auto-resize ----------
        const note = document.getElementById('in-note');
        note.addEventListener('input', () => {
            note.style.height = 'auto';
            note.style.height = note.scrollHeight + 'px';
        });

        // ---------- Sidebar Nav ----------
        document.querySelectorAll('.nav-side button').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.nav-side button').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                if (!btn.classList.contains('active') || btn.textContent.trim() !== 'LOG') {
                    toast(`${btn.textContent.trim()} — COMING SOON`);
                    setTimeout(() => {
                        document.querySelectorAll('.nav-side button').forEach(b => b.classList.remove('active'));
                        document.querySelector('.nav-side button').classList.add('active'); // First one is LOG
                    }, 100);
                }
            });
        });
    </script>
</body>

</html>
